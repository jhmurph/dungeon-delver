[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dungeon-delver"
version = "0.1.0"
description = "A text-based dungeon crawler game"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "colorama>=0.4.6",
]

[project.scripts]
dungeon-delver = "dungeon.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
